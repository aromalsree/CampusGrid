{% extends "base.html" %}

{% block title %}Password Reset Complete | CampusGrid{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-white dark:bg-navy-800 rounded-3xl p-8 sm:p-10 border border-slate-200 dark:border-slate-700 shadow-xl space-y-6 text-center">
        
        <div class="w-12 h-12 bg-emerald-500/10 text-emerald-500 rounded-2xl flex items-center justify-center mx-auto">
            <i data-lucide="check-circle" class="w-6 h-6"></i>
        </div>
        <h1 class="font-heading text-2xl font-extrabold text-slate-900 dark:text-white">Password Updated!</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">Your password has been changed successfully. You may now sign in with your new credentials.</p>

        <div class="pt-4 border-t border-slate-200 dark:border-slate-700">
            <a href="{% url 'marketplace:login' %}" class="inline-block px-8 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl text-xs shadow transition">
                Sign In Now
            </a>
        </div>

    </div>
</div>
{% endblock %}
