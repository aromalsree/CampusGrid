{% extends "base.html" %}

{% block title %}Reset Password | CampusGrid{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-white dark:bg-navy-800 rounded-3xl p-8 sm:p-10 border border-slate-200 dark:border-slate-700 shadow-xl space-y-6">
        
        <div class="text-center">
            <div class="w-12 h-12 bg-emerald-500/10 text-emerald-500 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i data-lucide="key-round" class="w-6 h-6"></i>
            </div>
            <h1 class="font-heading text-2xl font-extrabold text-slate-900 dark:text-white">Reset Password</h1>
            <p class="text-xs text-slate-400 mt-1">Enter your registered email address and we'll send you a password reset link.</p>
        </div>

        <form method="POST" class="space-y-4 text-xs">
            {% csrf_token %}
            <div>
                <label class="block font-bold text-slate-700 dark:text-slate-300 mb-1">Email Address</label>
                <input type="email" name="email" required autocomplete="email" class="w-full bg-slate-50 dark:bg-navy-900 border border-slate-300 dark:border-slate-700 rounded-xl p-3 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:border-emerald-500" placeholder="student@university.edu">
            </div>

            <button type="submit" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-lg transition">
                Send Reset Link
            </button>
        </form>

        <div class="text-center pt-4 border-t border-slate-200 dark:border-slate-700 text-xs">
            <a href="{% url 'marketplace:login' %}" class="font-bold text-emerald-500 hover:underline">
                Back to Sign In
            </a>
        </div>

    </div>
</div>
{% endblock %}
