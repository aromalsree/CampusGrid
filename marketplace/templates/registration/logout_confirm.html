{% extends "base.html" %}
{% load static %}

{% block title %}Sign Out | CampusGrid{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16 text-center space-y-6">
    <div class="w-16 h-16 rounded-2xl bg-slate-100 dark:bg-navy-800 text-slate-400 flex items-center justify-center mx-auto">
        <i data-lucide="log-out" class="w-8 h-8"></i>
    </div>
    
    <h1 class="font-heading text-2xl font-extrabold text-slate-900 dark:text-white">Sign Out of CampusGrid</h1>
    <p class="text-xs text-slate-500 dark:text-slate-400">Are you sure you want to sign out from this session?</p>

    <form method="POST" action="{% url 'marketplace:logout' %}" class="space-y-3">
        {% csrf_token %}
        <button type="submit" class="w-full py-3 bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs rounded-xl shadow transition">
            Yes, Sign Out
        </button>
        <a href="{% url 'marketplace:index' %}" class="block text-xs font-semibold text-slate-400 hover:text-slate-600">
            Cancel and Return Home
        </a>
    </form>
</div>
{% endblock %}
