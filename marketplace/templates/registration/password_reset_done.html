{% extends "base.html" %}

{% block title %}Reset Link Sent | CampusGrid{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full bg-white dark:bg-navy-800 rounded-3xl p-8 sm:p-10 border border-slate-200 dark:border-slate-700 shadow-xl space-y-6 text-center">
        
        <div class="w-12 h-12 bg-emerald-500/10 text-emerald-500 rounded-2xl flex items-center justify-center mx-auto">
            <i data-lucide="mail-check" class="w-6 h-6"></i>
        </div>
        <h1 class="font-heading text-2xl font-extrabold text-slate-900 dark:text-white">Check Your Inbox</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">If an account exists with the email you entered, you will receive password reset instructions shortly.</p>

        <div class="pt-4 border-t border-slate-200 dark:border-slate-700">
            <a href="{% url 'marketplace:login' %}" class="inline-block px-6 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl text-xs shadow transition">
                Return to Sign In
            </a>
        </div>

    </div>
</div>
{% endblock %}
