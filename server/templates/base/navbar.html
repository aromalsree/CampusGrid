{% load static %}
<header class="cg-header">
    <div class="cg-container">
        <div class="cg-nav-inner">
            <!-- Brand Logo -->
            <a href="/" class="cg-brand" aria-label="CampusGrid Home">
                <div class="cg-brand-icon">CG</div>
                <span>CampusGrid</span>
            </a>

            <!-- Primary Navigation Links -->
            <nav class="cg-nav-links" aria-label="Primary Navigation">
                <a href="/" class="cg-nav-link">Home</a>
                <a href="/products/" class="cg-nav-link">Marketplace</a>
                <a href="/compare/" class="cg-nav-link">Compare</a>
                <a href="/requests/" class="cg-nav-link">Need Board</a>
            </nav>

            <!-- Action & Auth Controls -->
            <div class="cg-nav-actions">
                {% if request.user.is_authenticated %}
                    <a href="/wishlist/" class="cg-nav-link" title="Wishlist" aria-label="Wishlist">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                        </svg>
                    </a>
                    <a href="/notifications/" class="cg-nav-link" title="Notifications" aria-label="Notifications">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                        </svg>
                    </a>
                    <a href="/dashboard/" class="cg-nav-link">Dashboard</a>
                    <!-- User Dropdown -->
                    <div class="user-dropdown">
                        <button class="btn btn-sm btn-outline dropdown-toggle" type="button">
                            {{ request.user.username|default:"Profile" }}
                            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-left: 0.375rem;">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div class="dropdown-menu">
                            <a href="/profile/" class="dropdown-item">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 0.5rem;">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                Profile
                            </a>
                            <a href="/settings/" class="dropdown-item">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 0.5rem;">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                </svg>
                                Settings
                            </a>
                            <hr class="dropdown-divider">
                            <a href="/user/logout/" class="dropdown-item dropdown-item-danger">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 0.5rem;">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                                </svg>
                                Logout
                            </a>
                        </div>
                    </div>
                    <a href="/seller/products/add/" class="btn btn-sm btn-primary">+ Sell Item</a>
                {% else %}
                    <a href="/login/" class="btn btn-sm btn-outline">Log in</a>
                    <a href="/register/" class="btn btn-sm btn-primary">Join CampusGrid</a>
                {% endif %}

                <!-- Mobile Menu Hamburger Button -->
                <button type="button" class="btn btn-sm btn-outline" data-mobile-menu-toggle aria-label="Open Mobile Menu" style="display: none;">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <!-- Responsive Mobile Drawer Include -->
    {% include "base/mobile_nav.html" %}
</header>
