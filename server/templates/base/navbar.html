{% load static %}
<header class="cg-header">
    <div class="cg-container">
        <div class="cg-nav-inner">
            <!-- Brand Logo -->
            <a href="/" class="cg-brand" aria-label="CampusGrid Home">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none" class="cg-logo-mark" xmlns="http://www.w3.org/2000/svg">
                    <rect width="28" height="28" rx="6" fill="#0F172A"/>
                    <rect x="4" y="4" width="9" height="9" rx="2" fill="#334155"/>
                    <rect x="15" y="4" width="9" height="9" rx="2" fill="#10B981"/>
                    <rect x="4" y="15" width="9" height="9" rx="2" fill="#1E293B"/>
                    <rect x="15" y="15" width="9" height="9" rx="2" fill="#334155"/>
                </svg>
                <span>CampusGrid</span>
            </a>

            <!-- Primary Navigation Links -->
            <nav class="cg-nav-links" aria-label="Primary Navigation">
                <a href="{% url 'home' %}" class="cg-nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
                <a href="{% url 'market:product_list' %}" class="cg-nav-link {% if 'market' in request.resolver_match.app_names or 'product' in request.resolver_match.url_name %}active{% endif %}">Marketplace</a>
                <a href="{% url 'market:products_compare' %}" class="cg-nav-link {% if 'compare' in request.resolver_match.url_name %}active{% endif %}">Compare</a>
                <a href="/requests/" class="cg-nav-link {% if 'requests' in request.resolver_match.url_name %}active{% endif %}">Need Board</a>
            </nav>

            <!-- Action & Auth Controls -->
            <div class="cg-nav-actions">
                <!-- Theme Toggle Button -->
                <button type="button" class="cg-theme-toggle btn btn-sm btn-outline" aria-label="Toggle dark/light mode" title="Toggle theme">
                    <svg class="theme-icon-moon" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    <svg class="theme-icon-sun" width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display:none;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                </button>

                {% if request.user.is_authenticated %}
                    <a href="/dashboard/wishlist/" class="cg-nav-link" title="Wishlist" aria-label="Wishlist">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                        </svg>
                    </a>
                    <a href="/dashboard/notifications/" class="cg-nav-link cg-notif-trigger" title="Notifications" aria-label="Notifications">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                        </svg>
                        <span class="cg-notif-dot"></span>
                    </a>
                    <a href="/dashboard/" class="cg-nav-link {% if 'dashboard' in request.resolver_match.url_name %}active{% endif %}">Dashboard</a>
                    <!-- User Dropdown -->
                    <div class="user-dropdown">
                        <button class="btn btn-sm btn-outline dropdown-toggle" type="button">
                            <span class="cg-seller-avatar-sm" style="margin-right: 0.375rem; width: 20px; height: 20px; font-size: 0.625rem;">{{ request.user.username|slice:":1"|upper }}</span>
                            {{ request.user.username|default:"Profile" }}
                            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-left: 0.375rem;">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div class="dropdown-menu">
                            <a href="/profile/" class="dropdown-item">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 0.5rem;">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                Profile
                            </a>
                            <a href="/settings/" class="dropdown-item">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 0.5rem;">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                </svg>
                                Settings
                            </a>
                            <hr class="dropdown-divider">
                            <a href="{% url 'logout' %}" class="dropdown-item dropdown-item-danger">
                                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-right: 0.5rem;">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                                </svg>
                                Logout
                            </a>
                        </div>
                    </div>
                    <a href="{% url 'market:create_listing' %}" class="btn btn-sm btn-primary">+ Sell Item</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-sm btn-outline">Log in</a>
                    <a href="{% url 'register' %}" class="btn btn-sm btn-primary">Join CampusGrid</a>
                {% endif %}

                <!-- Mobile Menu Hamburger Button -->
                <button type="button" class="btn btn-sm btn-outline cg-hamburger" data-mobile-menu-toggle aria-label="Open Mobile Menu">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <!-- Responsive Mobile Drawer Include -->
    {% include "base/mobile_nav.html" %}
</header>
