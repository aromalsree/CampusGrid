<div id="cg-mobile-nav" class="cg-mobile-drawer" aria-label="Mobile Navigation">
    <div style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1.25rem;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div class="cg-brand">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none" class="cg-logo-mark" xmlns="http://www.w3.org/2000/svg">
                    <rect width="28" height="28" rx="6" fill="#0F172A"/>
                    <rect x="4" y="4" width="9" height="9" rx="2" fill="#334155"/>
                    <rect x="15" y="4" width="9" height="9" rx="2" fill="#10B981"/>
                    <rect x="4" y="15" width="9" height="9" rx="2" fill="#1E293B"/>
                    <rect x="15" y="15" width="9" height="9" rx="2" fill="#334155"/>
                </svg>
                <span>CampusGrid</span>
            </div>
            <button type="button" data-mobile-menu-toggle aria-label="Close Menu" class="btn btn-sm btn-ghost" style="font-size: 1.5rem; line-height: 1; padding: 0.25rem 0.5rem;">&times;</button>
        </div>
        <nav style="display: flex; flex-direction: column; gap: 0.875rem; margin-top: 1rem;">
            <a href="{% url 'home' %}" class="cg-nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
            <a href="{% url 'market:product_list' %}" class="cg-nav-link {% if 'market' in request.resolver_match.app_names or 'product' in request.resolver_match.url_name %}active{% endif %}">Marketplace</a>
            <a href="{% url 'market:products_compare' %}" class="cg-nav-link {% if 'compare' in request.resolver_match.url_name %}active{% endif %}">Compare Electronics</a>
            <a href="/requests/" class="cg-nav-link {% if 'requests' in request.resolver_match.url_name %}active{% endif %}">Student Need Board</a>
            <hr style="border: 0; border-top: 1px solid var(--cg-border); margin: 0.5rem 0;">
            {% if request.user.is_authenticated %}
                <a href="/dashboard/" class="cg-nav-link">Dashboard Overview</a>
                <a href="/dashboard/listings/" class="cg-nav-link">My Listings</a>
                <a href="/dashboard/wishlist/" class="cg-nav-link">Saved Wishlist</a>
                <a href="/profile/" class="cg-nav-link">Profile Details</a>
                <a href="/settings/" class="cg-nav-link">Account Settings</a>
                <a href="{% url 'market:create_listing' %}" class="btn btn-sm btn-primary btn-full">+ Sell Item</a>
                <a href="{% url 'logout' %}" class="btn btn-sm btn-outline btn-full">Log out</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-full btn-outline">Log in</a>
                <a href="{% url 'register' %}" class="btn btn-full btn-primary">Join CampusGrid</a>
            {% endif %}
        </nav>
    </div>
</div>
<div data-mobile-overlay aria-hidden="true"></div>
