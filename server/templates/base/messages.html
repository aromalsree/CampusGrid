{% if messages %}
<div id="cg-toast-container" class="cg-messages-wrap" aria-live="polite">
    {% for message in messages %}
    <div class="cg-toast cg-toast--{{ message.tags|default:'info' }} cg-alert cg-alert-{{ message.tags|default:'info' }}" role="alert">
        <div style="display: flex; align-items: center; gap: 0.625rem;">
            {% if message.tags == 'success' %}
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            {% elif message.tags == 'error' %}
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01"/></svg>
            {% else %}
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" stroke-width="2"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 16v-4m0-4h.01"/></svg>
            {% endif %}
            <span class="cg-toast-text">{{ message }}</span>
        </div>
        <button type="button" class="cg-toast-close cg-alert-close" aria-label="Close alert">&times;</button>
    </div>
    {% endfor %}
</div>
{% endif %}
