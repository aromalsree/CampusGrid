<form action="/products/" method="GET" class="cg-search-bar" role="search">
    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: var(--cg-slate-400); margin-right: 0.5rem;">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
    </svg>
    <input type="text" 
           name="q" 
           value="{{ request.GET.q|default:'' }}" 
           placeholder="{{ placeholder|default:'Search laptops, engineering notes, textbooks, lab tools...' }}" 
           class="cg-search-input" 
           aria-label="Search items">
    <button type="submit" class="btn btn-sm btn-primary">
        Search
    </button>
</form>
