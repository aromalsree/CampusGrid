<button type="button" 
        class="cg-wishlist-btn {% if in_wishlist %}active{% endif %}" 
        data-product-id="{% if product %}{{ product.id }}{% elif product_id %}{{ product_id }}{% else %}1{% endif %}"
        title="Save to Wishlist" 
        aria-label="Save to Wishlist"
        style="background: #FFFFFF; border: 1px solid var(--cg-border); border-radius: var(--radius-full); width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; color: {% if in_wishlist %}var(--cg-rose-500){% else %}var(--cg-slate-400){% endif %}; transition: var(--transition);">
    <svg width="18" height="18" fill="{% if in_wishlist %}currentColor{% else %}none{% endif %}" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
    </svg>
</button>
