<form method="POST" action="{% url 'add_wishlist' listing_id=product.id %}" style="display: inline;">
    {% csrf_token %}
    <button type="submit" 
            class="cg-wishlist-btn {% if in_wishlist %}active{% endif %}" 
          
            title="Save to Wishlist" 
            aria-label="Save to Wishlist"
            style="background: none; border: none; padding: 0; cursor: pointer; color: inherit;">
            <svg width="18" height="18" fill="{% if in_wishlist %}currentColor{% else %}none{% endif %}" stroke="currentColor" viewBox="0 0 24 24" style="pointer-events: none;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
        </svg>
    </button>
</form>
