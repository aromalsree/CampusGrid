<a href="{% if category %}/products/?category={{ category.slug|default:category.name }}{% else %}/products/{% endif %}" 
   class="cg-category-card" 
   style="background: #FFFFFF; border: 1px solid var(--cg-border); border-radius: var(--radius-lg); padding: 1.5rem 1.25rem; display: flex; flex-direction: column; align-items: center; text-align: center; transition: var(--transition); box-shadow: var(--shadow-sm);">
    <div style="width: 52px; height: 52px; border-radius: var(--radius-md); background: var(--cg-slate-100); display: flex; align-items: center; justify-content: center; margin-bottom: 1rem; color: var(--cg-navy-900);">
        <svg width="26" height="26" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
        </svg>
    </div>
    <h4 style="font-size: 1rem; font-weight: 700; color: var(--cg-navy-900); margin-bottom: 0.25rem;">
        {% if category %}{{ category.name }}{% else %}Textbooks & Guides{% endif %}
    </h4>
    <span style="font-size: 0.8125rem; color: var(--cg-slate-500);">
        {% if category and category.count %}{{ category.count }} items{% else %}24 items{% endif %}
    </span>
</a>
