{% extends "base/base.html" %}
{% load static %}

{% block title %}Reset Password | CampusGrid{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/pages/user.css' %}">
{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Reset Password</h1>
            <p class="text-muted text-sm">Enter your university email to receive a secure recovery link.</p>
        </div>

        <form method="POST" action="">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_email" class="form-label">Account Email</label>
                <input type="email" name="email" id="id_email" class="form-control" required autofocus placeholder="student@university.edu">
            </div>
            <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">
                Send Recovery Instructions
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
            <a href="/login/" style="color: var(--cg-slate-500); font-weight: 500;">&larr; Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
