{% extends "base/base.html" %}
{% load static %}

{% block title %}Set New Password | CampusGrid{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/pages/user.css' %}">
{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Set New Password</h1>
            <p class="text-muted text-sm">Please choose a strong, secure password for your account.</p>
        </div>

        <form method="POST" action="">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_new_password1" class="form-label">New Password</label>
                <input type="password" name="new_password1" id="id_new_password1" class="form-control" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
            </div>
            <div class="form-group">
                <label for="id_new_password2" class="form-label">Confirm New Password</label>
                <input type="password" name="new_password2" id="id_new_password2" class="form-control" required placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
            </div>
            <button type="submit" class="btn btn-primary btn-full" style="margin-top: 1rem;">
                Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}
